[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "musclemap-mlx"
version = "0.3.0"
description = "Segment 113 whole-body muscle and bone structures with MuscleMap v1.4 and native MLX"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
license-files = ["LICENSE", "UPSTREAM_LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
  { name = "Joseph Sandoval" },
  { name = "Alfredo Sandoval Jr." },
]
keywords = [
  "mlx",
  "apple-silicon",
  "metal",
  "medical-imaging",
  "musclemap",
  "whole-body",
  "segmentation",
  "mri",
  "ct",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Processing",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Typing :: Typed",
]
dependencies = [
  "medmlx-core[nifti]>=0.3.2,<0.4",
  "mlx==0.32.4; platform_system == 'Darwin' and platform_machine == 'arm64'",
  "nibabel>=5.3,<6",
  "numpy>=2.0,<3",
  "scipy>=1.14,<2",
]

[project.urls]
Homepage = "https://medmlx.org"
Documentation = "https://github.com/MedMLX/musclemap-mlx/blob/v0.3.0/README.md"
Repository = "https://github.com/MedMLX/musclemap-mlx"
Issues = "https://github.com/MedMLX/musclemap-mlx/issues"
Weights = "https://huggingface.co/MedMLX/musclemap-mlx"
Upstream = "https://github.com/MuscleMap/MuscleMap"
MedMLX = "https://github.com/MedMLX/medmlx"

[project.scripts]
"musclemap-mlx" = "musclemap_mlx.cli:main"

[project.entry-points."medmlx.models"]
musclemap = "musclemap_mlx.medmlx:MODEL"
[dependency-groups]
dev = [
  "monai==1.6.1",
  "pyright==1.1.414",
  "pytest>=8.4,<10",
  "ruff>=0.13,<1",
  "safetensors>=0.4,<1",
  "scipy-stubs>=1.18.1,<1.19",
  "torch==2.14.1",
]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
required-environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]
constraint-dependencies = ["setuptools>=84.1.0", "filelock>=4.2.1"]
[tool.hatch.build.targets.wheel]
packages = ["src/musclemap_mlx"]
[tool.hatch.build.targets.sdist]
only-include = [
  "src/musclemap_mlx",
  "pyproject.toml",
  "README.md",
  "LICENSE",
  "THIRD_PARTY_NOTICES.md",
  "UPSTREAM_LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "TID251", "TID252", "ANN401"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any" = { msg = "Use a precise type and parse untyped values at the boundary." }
"typing_extensions.Any" = { msg = "Use a precise type and parse untyped values at the boundary." }
[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
enableTypeIgnoreComments = false
reportUnnecessaryTypeIgnoreComment = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
markers = [
  "metal: needs the MLX Metal GPU and the shared Perfkit GPU lock",
  "oracle: compares against a recorded MONAI 1.3.2 reference; opt-in",
]
